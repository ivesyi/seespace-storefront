<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <link rel="icon" href="/favicon.ico" sizes="32x32" />
  <link rel="icon" href="/favicon-32.png?v=1" type="image/png" sizes="32x32" />
  <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <title>Cart — SeeSpace</title>
  <link rel="canonical" href="https://shops.yiqiai.tech/cart/" />
  <link rel="stylesheet" href="/css/styles.css?v=13" />
</head>
<body>
  <div class="notice">Tracked shipping to the US, UK, Canada, and Australia.</div>
  <header class="site-header">
    <div class="wrap bar">
      <a class="brand" href="/">SeeSpace</a>
      <nav>
        <a href="/">Home</a>
        <a href="/shop/">Shop</a>
        <a href="/about/">About</a>
      </nav>
      <a class="cart-link" href="/cart/" aria-current="page">Cart (<span data-cart-count>0</span>)</a>
    </div>
  </header>
  <main class="wrap section">
    <h2 class="cart-title">Your cart</h2>
    <div id="rows"></div>
    <div class="cart-summary" id="summary" hidden>
      <p id="total"></p>
      <p class="small muted">Shipping and taxes are calculated at checkout.</p>
      <div class="actions">
        <button class="btn" type="button" id="checkout">Secure checkout</button>
      </div>
      <p class="small muted">Shopify Checkout · PayPal available</p>
      <p><a class="text-link" href="/shop/">Continue shopping</a></p>
    </div>
  </main>
  <footer class="site-footer">
    <div class="wrap">SeeSpace. hello@shops.yiqiai.tech. © <span id="year"></span></div>
  </footer>
  <script type="module">
    import { getCart, setCart, setCartQty, money, checkout, productHref, cartIcon } from "/js/app.js?v=11";
    const title = document.querySelector(".cart-title");
    if (title && !title.querySelector(".icon-cart")) title.insertAdjacentHTML("afterbegin", cartIcon());
    const rows = document.getElementById("rows");
    const total = document.getElementById("total");
    const summary = document.getElementById("summary");
    function paint() {
      const cart = getCart();
      if (!cart.length) {
        rows.innerHTML = `<div class="empty-cart">${cartIcon()}<p class="muted">Your cart is empty. <a class="text-link" href="/shop/">Browse organizers</a></p></div>`;
        summary.hidden = true;
        return;
      }
      summary.hidden = false;
      rows.innerHTML = cart.map((i) => `
        <div class="cart-row" data-sku="${i.sku}">
          ${i.image ? `<img class="cart-thumb" src="${i.image}" alt="" />` : `<div class="cart-thumb swatch"></div>`}
          <div>
            <a href="${productHref(i.handle)}">${i.title}</a>
            <div class="small muted">${money(i.price)} each</div>
            <button class="text-btn" type="button" data-remove="${i.sku}">Remove</button>
          </div>
          <div class="qty">
            <button type="button" data-dec="${i.sku}" aria-label="Decrease">−</button>
            <input value="${i.qty}" readonly />
            <button type="button" data-inc="${i.sku}" aria-label="Increase">+</button>
          </div>
          <div class="line">${money(i.price * i.qty)}</div>
        </div>`).join("");
      const sum = cart.reduce((a, i) => a + i.price * i.qty, 0);
      total.textContent = `Subtotal ${money(sum)}`;
    }
    rows.addEventListener("click", (e) => {
      const sku = e.target.dataset.remove || e.target.dataset.inc || e.target.dataset.dec;
      if (!sku) return;
      const item = getCart().find((i) => i.sku === sku);
      if (!item) return;
      if (e.target.dataset.remove) setCart(getCart().filter((i) => i.sku !== sku));
      else if (e.target.dataset.inc) setCartQty(sku, item.qty + 1);
      else setCartQty(sku, item.qty - 1);
      paint();
    });
    document.getElementById("checkout").addEventListener("click", checkout);
    paint();
  </script>
</body>
</html>
