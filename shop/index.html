<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <link rel="icon" href="/favicon.ico" sizes="32x32" />
  <link rel="icon" href="/favicon-32.png?v=1" type="image/png" sizes="32x32" />
  <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <title>Shop — SeeSpace</title>
  <link rel="canonical" href="https://shops.yiqiai.tech/shop/" />
  <link rel="stylesheet" href="/css/styles.css?v=13" />
</head>
<body>
  <div class="notice">Tracked shipping to the US, UK, Canada, and Australia.</div>
  <header class="site-header">
    <div class="wrap bar">
      <a class="brand" href="/">SeeSpace</a>
      <nav>
        <a href="/">Home</a>
        <a href="/shop/" aria-current="page">Shop</a>
        <a href="/about/">About</a>
      </nav>
      <a class="cart-link" href="/cart/">Cart (<span data-cart-count>0</span>)</a>
    </div>
  </header>
  <main class="wrap section">
    <h2>Shop</h2>
    <p class="muted">A short list of organizers. Prices in US dollars.</p>
    <div class="filter" id="filters"></div>
    <div class="grid" id="grid"></div>
  </main>
  <footer class="site-footer">
    <div class="wrap">SeeSpace. hello@shops.yiqiai.tech. © <span id="year"></span></div>
  </footer>
  <script type="module">
    import { loadCatalog, cardHTML, shopHref } from "/js/app.js?v=10";
    const products = await loadCatalog();
    const types = ["All", ...new Set(products.map((p) => p.type))];
    const params = new URLSearchParams(location.search);
    let current = params.get("type") || "All";
    const filters = document.getElementById("filters");
    const grid = document.getElementById("grid");
    function paint() {
      filters.innerHTML = types.map((t) =>
        `<button data-type="${t}" class="${t === current ? "on" : ""}">${t}</button>`
      ).join("");
      const list = current === "All" ? products : products.filter((p) => p.type === current);
      grid.innerHTML = list.map(cardHTML).join("");
    }
    filters.addEventListener("click", (e) => {
      const t = e.target.dataset.type;
      if (!t) return;
      current = t;
      history.replaceState(null, "", shopHref(t));
      paint();
    });
    paint();
  </script>
</body>
</html>
