<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <link rel="icon" href="/favicon.ico" sizes="32x32" />
  <link rel="icon" href="/favicon-32.png?v=1" type="image/png" sizes="32x32" />
  <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
  <title>Redirecting — SeeSpace</title>
  <script>
    const handle = new URLSearchParams(location.search).get("handle");
    location.replace(handle ? `/product/${handle}/` : "/shop/");
  </script>
</head>
<body>
  <p><a href="/shop/">Continue to shop</a></p>
</body>
</html>
